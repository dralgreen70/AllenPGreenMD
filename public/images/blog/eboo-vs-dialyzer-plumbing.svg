<svg viewBox="0 0 920 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" style="width:100%;height:auto;max-width:920px;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <title id="t">How a dialyzer is meant to run versus how EBOO rewires it</title>
  <desc id="d">Two schematics. Left: hemodialysis, blood inside the fibers, dialysate counter-current in the jacket, solutes diffuse into the dialysate. Right: EBOO, blood in the jacket, gas inside the fibers, no dialysate, only a thin plasma ultrafiltrate drips out as waste while cells and proteins return to the patient.</desc>

  <defs>
    <marker id="aRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d64545"/></marker>
    <marker id="aBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3b7dd8"/></marker>
    <marker id="aCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3a9fb8"/></marker>
  </defs>

  <rect x="1" y="1" width="918" height="698" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="460" y="40" font-size="21" font-weight="700" fill="#14233a" text-anchor="middle">How a dialyzer is meant to run vs. how EBOO rewires it</text>
  <line x1="460" y1="70" x2="460" y2="600" stroke="#e2e8f0" stroke-width="2"/>

  <!-- ===================== PANEL A: HEMODIALYSIS ===================== -->
  <text x="230" y="92" font-size="16.5" font-weight="700" fill="#1f3a63" text-anchor="middle">HEMODIALYSIS (as designed)</text>

  <!-- jacket body -->
  <rect x="170" y="170" width="80" height="280" fill="#d3e0f5" stroke="#9aa7b5" stroke-width="2"/>
  <!-- inner fiber bundle (blood) -->
  <rect x="188" y="178" width="44" height="264" fill="#f3d3d3" stroke="#cdb3b3" stroke-width="1"/>
  <!-- tube sheets -->
  <rect x="170" y="170" width="80" height="10" fill="#5b6b7d"/>
  <rect x="170" y="440" width="80" height="10" fill="#5b6b7d"/>
  <!-- fibers -->
  <g stroke="#c97b7b" stroke-width="1.5"><line x1="196" y1="182" x2="196" y2="438"/><line x1="204" y1="182" x2="204" y2="438"/><line x1="212" y1="182" x2="212" y2="438"/><line x1="220" y1="182" x2="220" y2="438"/></g>
  <!-- caps -->
  <path d="M170 170 L250 170 L236 150 L184 150 Z" fill="#c7d2e0" stroke="#9aa7b5" stroke-width="1.5"/>
  <path d="M170 450 L250 450 L236 470 L184 470 Z" fill="#c7d2e0" stroke="#9aa7b5" stroke-width="1.5"/>
  <!-- axial port stubs -->
  <rect x="202" y="120" width="16" height="30" fill="#d64545"/>
  <rect x="202" y="470" width="16" height="30" fill="#d64545"/>
  <!-- radial port stubs -->
  <rect x="250" y="196" width="34" height="13" fill="#3b7dd8"/>
  <rect x="250" y="411" width="34" height="13" fill="#3b7dd8"/>

  <!-- blood flow arrows (down inside fibers) -->
  <line x1="210" y1="195" x2="210" y2="430" stroke="#d64545" stroke-width="3" marker-end="url(#aRed)"/>
  <!-- dialysate flow arrows (up in jacket, counter-current) -->
  <line x1="179" y1="430" x2="179" y2="190" stroke="#3b7dd8" stroke-width="3" marker-end="url(#aBlue)"/>
  <line x1="241" y1="430" x2="241" y2="190" stroke="#3b7dd8" stroke-width="3" marker-end="url(#aBlue)"/>

  <!-- labels -->
  <text x="226" y="112" font-size="12.5" font-weight="600" fill="#a82f2f">Blood in</text>
  <text x="226" y="495" font-size="12.5" font-weight="600" fill="#a82f2f">Blood out</text>
  <text x="290" y="206" font-size="12.5" font-weight="600" fill="#2b5fa5">Dialysate out (waste)</text>
  <text x="290" y="421" font-size="12.5" font-weight="600" fill="#2b5fa5">Dialysate in</text>

  <text x="230" y="540" font-size="12.5" fill="#34465a" text-anchor="middle">Blood inside the fibers, dialysate counter-current in</text>
  <text x="230" y="558" font-size="12.5" fill="#34465a" text-anchor="middle">the jacket. Solutes diffuse out of the blood into the</text>
  <text x="230" y="576" font-size="12.5" fill="#34465a" text-anchor="middle">dialysate, which carries them away. Real removal.</text>

  <!-- ===================== PANEL B: EBOO ===================== -->
  <text x="690" y="92" font-size="16.5" font-weight="700" fill="#7a3a2f" text-anchor="middle">EBOO (a dialyzer run backwards)</text>

  <!-- jacket body (blood) -->
  <rect x="630" y="170" width="80" height="280" fill="#f3d3d3" stroke="#9aa7b5" stroke-width="2"/>
  <!-- inner fiber bundle (gas) -->
  <rect x="648" y="178" width="44" height="264" fill="#dceef3" stroke="#b6d6de" stroke-width="1"/>
  <rect x="630" y="170" width="80" height="10" fill="#5b6b7d"/>
  <rect x="630" y="440" width="80" height="10" fill="#5b6b7d"/>
  <g stroke="#7fc0cf" stroke-width="1.5"><line x1="656" y1="182" x2="656" y2="438"/><line x1="664" y1="182" x2="664" y2="438"/><line x1="672" y1="182" x2="672" y2="438"/><line x1="680" y1="182" x2="680" y2="438"/></g>
  <path d="M630 170 L710 170 L696 150 L644 150 Z" fill="#c7d2e0" stroke="#9aa7b5" stroke-width="1.5"/>
  <path d="M630 450 L710 450 L696 470 L644 470 Z" fill="#c7d2e0" stroke="#9aa7b5" stroke-width="1.5"/>
  <!-- axial stubs: top gas, bottom waste -->
  <rect x="662" y="120" width="16" height="30" fill="#3a9fb8"/>
  <rect x="662" y="470" width="16" height="30" fill="#d9a441"/>
  <!-- radial stubs: blood -->
  <rect x="710" y="196" width="34" height="13" fill="#d64545"/>
  <rect x="710" y="411" width="34" height="13" fill="#d64545"/>

  <!-- gas flow (down inside fibers) -->
  <line x1="670" y1="195" x2="670" y2="430" stroke="#3a9fb8" stroke-width="3" marker-end="url(#aCyan)"/>
  <!-- blood flow (up in jacket) -->
  <line x1="639" y1="430" x2="639" y2="190" stroke="#d64545" stroke-width="3" marker-end="url(#aRed)"/>
  <line x1="701" y1="430" x2="701" y2="190" stroke="#d64545" stroke-width="3" marker-end="url(#aRed)"/>
  <!-- waste drip -->
  <circle cx="670" cy="512" r="3" fill="#d9a441"/>
  <circle cx="670" cy="524" r="3.5" fill="#d9a441"/>

  <text x="686" y="112" font-size="12.5" font-weight="600" fill="#2a7e93">Gas in (O3 / O2)</text>
  <text x="650" y="495" font-size="12.5" font-weight="600" fill="#b07d1e" text-anchor="end">Waste (ultrafiltrate)</text>
  <text x="750" y="206" font-size="12.5" font-weight="600" fill="#a82f2f">Blood out</text>
  <text x="750" y="421" font-size="12.5" font-weight="600" fill="#a82f2f">Blood in</text>

  <text x="690" y="540" font-size="12.5" fill="#34465a" text-anchor="middle">Blood in the jacket, gas inside the fibers, no dialysate.</text>
  <text x="690" y="558" font-size="12.5" fill="#34465a" text-anchor="middle">Gas diffuses in; pressure pushes out a little plasma water.</text>
  <text x="690" y="576" font-size="12.5" fill="#34465a" text-anchor="middle">Cells and everything from albumin up stay in the blood.</text>

  <!-- bottom takeaway -->
  <line x1="40" y1="612" x2="880" y2="612" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="460" y="640" font-size="14.5" font-weight="700" fill="#14233a" text-anchor="middle">Same hardware. One has a receiving fluid that carries solutes away. The other does not.</text>
  <text x="460" y="662" font-size="13" fill="#5b6b7d" text-anchor="middle">Without dialysate, the only things leaving the blood are gas and a thin, non-selective ultrafiltrate of water and small solutes.</text>
</svg>
